<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#0F766E","#7C3AED"]},"sDesign":{"editor":"int","default":4,"min":1,"max":5,"section":"能力自評"},"sPlan":{"editor":"int","default":3,"min":1,"max":5,"section":"能力自評"},"sPM":{"editor":"int","default":3,"min":1,"max":5,"section":"能力自評"},"sSocial":{"editor":"int","default":3,"min":1,"max":5,"section":"能力自評"},"sComm":{"editor":"int","default":3,"min":1,"max":5,"section":"能力自評"},"sLang":{"editor":"int","default":4,"min":1,"max":5,"section":"能力自評"},"$preview":{"width":1440,"height":4800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.full = '我是 Leichen，就讀國立政治大學財政學系，現於系學會、政大藝術季及多項專案中負責美宣與企劃工作。我擅長將團隊的發想轉化為可執行的方案，負責專案管理與風險評估，並結合人工智能協作，將構想落實為觀眾看得見、用得上的成果。'; this.state = { n: 0, ph: null, roll: 'all' }; }
  componentDidMount() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ n: this.full.length }); return; }
    this.t0 = setTimeout(() => {
      this.timer = setInterval(() => {
        const n = this.state.n + 1;
        this.setState({ n });
        if (n >= this.full.length) clearInterval(this.timer);
      }, 55);
    }, 2100);
  }
  componentWillUnmount() { clearTimeout(this.t0); clearInterval(this.timer); }
  renderVals() {
    const B = '';
    const P = [
      ['leon1', 'camino-leon1.jpg', '途經萊昂（León）老城'],
      ['leon2', 'camino-leon2.jpg', '午後的街角'],
      ['walk', 'camino-walk.jpg', '和夥伴一起走在加利西亞的鄉間'],
      ['field', 'camino-field.jpg', '金黃麥田間的小徑'],
      ['shell', 'camino-shell.jpg', '背包上的貝殼，朝聖者的記號'],
      ['sign', 'camino-sign.jpg', '前往 Palas de Rei 的路標'],
      ['km54', 'camino-km54.jpg', '石牆前的里程碑'],
      ['km42', 'camino-km42.jpg', '距離終點 42 公里'],
      ['light', 'camino-light.jpg', '午後的光'],
      ['autumn', 'camino-autumn.jpg', '落葉鋪成的林蔭步道'],
      ['fruit', 'camino-fruit.jpg', '路邊水果攤上的臺灣國旗'],
      ['lake', 'camino-lake.jpg', '湖邊稍作休息'],
      ['stamps', 'camino-stamps.jpg', '一路蓋滿印章的朝聖護照'],
      ['pulpo', 'camino-pulpo.jpg', '加利西亞章魚，一天的犒賞'],
      ['village', 'camino-village.jpg', '穿過加利西亞的小村莊'],
      ['ribadiso', 'camino-ribadiso.jpg', 'Ribadiso 的朝聖者庇護所'],
      ['barrels', 'camino-barrels.jpg', '路邊會笑的油桶'],
      ['wisdom', 'camino-wisdom.jpg', '在智慧之牆前展開朝聖護照'],
      ['leather', 'camino-leather.jpg', '貝殼紋樣的手工皮件攤'],
      ['craft', 'camino-craft.jpg', '封蠟章與手環的工作台'],
      ['sealing', 'camino-sealing.jpg', '幫朝聖護照蓋上封蠟'],
      ['wax', 'camino-wax.jpg', '護照上的封蠟與小吊飾'],
      ['statue', 'camino-statue.jpg', '夕陽裡的朝聖者雕像'],
      ['towers', 'camino-towers.jpg', '聖地牙哥大教堂的雙塔'],
      ['cath_me', 'camino-cath-me.jpg', '抵達聖地牙哥大教堂'],
      ['balcony', 'camino-balcony.jpg', '聖地牙哥老城的花陽台'],
      ['cert', 'camino-cert.jpg', '拿到朝聖證書'],
      ['cath_night', 'camino-cath-night.jpg', '夜裡的大教堂'],
      ['rainbow', 'camino-rainbow.jpg', '斑駁的彩虹斑馬線'],
      ['km0', 'camino-km0.jpg', 'Km 0,000'],
      ['km0me', 'camino-km0me.jpg', '走到 Km 0,000']
    ];
    const photos = P.map(([k, id, cap], i) => ({ key: k, src: B + id, cap, open: () => this.setState({ ph: i }) }));
    const PEOPLE = ['walk', 'wisdom', 'cath_me', 'cert', 'km0me'];
    const scene = photos.filter((p) => PEOPLE.indexOf(p.key) < 0);
    const people = photos.filter((p) => PEOPLE.indexOf(p.key) >= 0);
    const mk = (list, no, title, start) => ({ no, title, frames: list.map((p, j) => ({ ...p, mark: '\u25B8 ' + (start + j + 1) + '  ' + (start + j + 1) + 'A  CAMINO 400' })) });
    const half = Math.ceil(scene.length / 2);
    const view = this.state.roll;
    const sceneRolls = [mk(scene.slice(0, half), 'ROLL 01', '風景・路上', 0), mk(scene.slice(half), 'ROLL 02', '風景・抵達', half)];
    const peopleRoll = [mk(people, 'ROLL 03', '旅途中的我', 0)];
    const rolls = view === 'people' ? peopleRoll : view === 'scene' ? sceneRolls : sceneRolls.concat(peopleRoll);
    const btnBase = 'display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 24px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ';
    const btn = (key, label, n) => {
      const on = view === key;
      return { label: label + '（' + n + '）', pressed: on ? 'true' : 'false',
        style: btnBase + (on ? 'background: #17161B; color: #FFFFFF; border: 1px solid #17161B' : 'background: #FFFFFF; color: #17161B; border: 1px solid #17161B'),
        toggle: () => this.setState({ roll: on ? 'all' : key }) };
    };
    const i = this.state.ph;
    const go = (d) => () => this.setState({ ph: (i + d + photos.length) % photos.length });
    const lb = i == null ? { show: false } : {
      show: true, src: photos[i].src, cap: photos[i].cap, counter: (i + 1) + ' / ' + photos.length,
      close: () => this.setState({ ph: null }), prev: go(-1), next: go(1)
    };
    const acc = this.props.accent ?? '#C2410C';
    const clamp = (v, d) => Math.max(1, Math.min(5, Number(v ?? d) || d));
    const SK = [
      ['視覺設計', clamp(this.props.sDesign, 4), '主視覺、社群版面', '動態與品牌系統經驗少'],
      ['企劃提案', clamp(this.props.sPlan, 3), 'PTGA 佳作、點識成金', '實際落地案例仍少'],
      ['專案管理', clamp(this.props.sPM, 3), '多個專案負責人', '預算與時程控管待磨練'],
      ['社群經營', clamp(this.props.sSocial, 3), '粉絲 4,000 → 5,000+', '數據分析與投放較弱'],
      ['溝通協調', clamp(this.props.sComm, 3), '藝術季跨部門對接', '身兼多職，時間分配'],
      ['語言能力', clamp(this.props.sLang, 4), 'IELTS 7.0（C1）', '西語僅 A1，口說待加強']
    ];
    const cx = 480, cy = 315, R = 170, n = SK.length;
    const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    const f = (v) => v.toFixed(1);
    const blocks = SK.map(([k, v, plus, minus], i) => {
      const [lx, ly] = pt(i, R + 26);
      const side = Math.abs(lx - cx) < 8 ? 'mid' : (lx > cx ? 'r' : 'l');
      const tx = side === 'mid' ? '-50%' : (side === 'r' ? '0' : '-100%');
      const ty = i === 0 ? '-100%' : (side === 'mid' ? '0' : '-50%');
      const align = side === 'mid' ? 'center' : (side === 'r' ? 'left' : 'right');
      return { name: k, score: v, plus, minus,
        style: 'position: absolute; left: ' + (lx / 960 * 100).toFixed(2) + '%; top: ' + (ly / 620 * 100).toFixed(2) + '%; transform: translate(' + tx + ', ' + ty + '); text-align: ' + align + '; line-height: 1.55; white-space: nowrap; font-family: Noto Sans TC, sans-serif' };
    });
    const radar = {
      label: '能力雷達圖：' + SK.map(([k, v, p, m]) => k + ' ' + v + ' 分，優勢：' + p + '，待加強：' + m).join('；'),
      rings: [1, 2, 3, 4, 5].map((k) => ({ pts: SK.map((_, i) => pt(i, R * k / 5).map(f).join(',')).join(' ') })),
      axes: SK.map((_, i) => { const [x, y] = pt(i, R); return { x: f(x), y: f(y) }; }),
      poly: SK.map(([, v], i) => pt(i, R * v / 5).map(f).join(',')).join(' '),
      dots: SK.map(([, v], i) => { const [x, y] = pt(i, R * v / 5); return { x: f(x), y: f(y) }; }),
      blocks
    };
    return { accent: this.props.accent ?? '#C2410C', rolls, rollOpen: true, btnAll: btn('all', '全部照片', photos.length), btnScene: btn('scene', '沿途風景', scene.length), btnPeople: btn('people', '旅途中的我', people.length), radar, typed: this.full.slice(0, this.state.n), photos, lb, photoCount: photos.length, coverOpen: () => this.setState({ ph: photos.length - 1 }) };
  }
}
</script>
