<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美宣作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
a{color:#F2F0EB}a:hover{color:#FF5A36}
@keyframes lc-rise{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes lc-zoom{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
@keyframes lc-curtain{0%,72%{transform:translateY(0)}100%{transform:translateY(-100%);visibility:hidden}}
@keyframes lc-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lc-name{from{opacity:0;letter-spacing:.5em;filter:blur(8px)}to{opacity:1;letter-spacing:.06em;filter:blur(0)}}
.lc-rise{animation:lc-rise 1s cubic-bezier(.2,.7,.2,1) both}
.lc-zoom{animation:lc-zoom 1.4s cubic-bezier(.2,.7,.2,1) both}
.lc-curtain{position:fixed;inset:0;z-index:100;background:#0B0B0D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:none;animation:lc-curtain 2.1s cubic-bezier(.7,0,.2,1) forwards}
.lc-name{animation:lc-name 1.1s cubic-bezier(.2,.7,.2,1) both}
.lc-bar{transform-origin:left;animation:lc-bar 1s .3s cubic-bezier(.7,0,.2,1) both}
@media (prefers-reduced-motion:reduce){.lc-rise,.lc-zoom,.lc-name,.lc-bar{animation:none}.lc-curtain{display:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="background: #0B0B0D; color: #F2F0EB; font-family: 'Noto Sans TC', 'Space Grotesk', sans-serif; min-height: 100vh">


<header style="max-width: 1360px; margin: 0 auto; padding: 20px 40px; display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center">
<a href="index.html" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-decoration: none">Leichen Huang<span style="color: {{accent}}">.</span></a>
<nav aria-label="網站選單" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px">
<a href="index.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; border-bottom: 2px solid transparent">首頁</a>
<a href="portfolio.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: {{accent}}; text-decoration: none; border-bottom: 2px solid {{accent}}">美宣作品集</a>
<a href="camino.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; border-bottom: 2px solid transparent">朝聖之路</a>
<a href="resume.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; border-bottom: 2px solid transparent">線上履歷</a>
</nav>
</header>

<section id="top" style="max-width: 1360px; margin: 0 auto; padding: 48px 40px 96px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<p class="lc-rise" style="animation-delay: 1.5s; margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.24em; color: {{accent}}">KEY VISUAL · PROMOTIONAL ART</p>
<h1 class="lc-rise" style="animation-delay: 1.62s; margin: 0; font-size: 72px; line-height: 1.08; font-weight: 900; letter-spacing: -0.01em">讓每一張主視覺<br>都成為第一眼。</h1>
<p class="lc-rise" style="animation-delay: 1.78s; margin: 0; max-width: 480px; font-size: 18px; line-height: 1.7; color: #A9A6A0">leichen，美宣設計師。現任系學會美宣長、2040school 美編組，做活動主視覺、社群貼文與新聞圖卡，也畫插畫。</p>
<div class="lc-rise" style="animation-delay: 1.9s; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
<a href="#works" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; background: {{accent}}; color: #0B0B0D; font-weight: 700; font-size: 16px; text-decoration: none; border-radius: 999px">看作品</a>
<a href="#contact" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border: 1px solid #3A3A42; font-weight: 500; font-size: 16px; text-decoration: none; border-radius: 999px">合作洽詢</a>
</div>
</div>
<figure class="lc-zoom" style="animation-delay: 1.55s; flex: 1.2 1 480px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 12px">
<img src="images/kv-5night.jpg" alt="五系聯合之夜「指南大5廳」主視覺" style="width: 100%; height: auto; display: block; border-radius: 6px">
<figcaption style="font-size: 14px; color: #8E8B94">五系聯合之夜「指南大5廳」主視覺 · 2026</figcaption>
</figure>
</section>

<section id="works" style="max-width: 1360px; margin: 0 auto; padding: 64px 40px 96px; border-top: 1px solid #222228">
<div style="display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end; margin-bottom: 40px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.24em; color: {{accent}}">SELECTED WORKS</p>
<h2 style="margin: 0; font-size: 44px; font-weight: 900">精選作品</h2>
</div>
<div role="group" aria-label="作品分類" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<button type="button" onClick="{{tab.pick}}" aria-pressed="{{tab.pressed}}" style="{{tab.style}}">{{tab.label}}</button>
</sc-for>
</div>
</div>
<div style="columns: 3 320px; column-gap: 24px">
<sc-for list="{{works}}" as="w" hint-placeholder-count="9">
<article style="break-inside: avoid; display: flex; flex-direction: column; gap: 14px; margin-bottom: 36px">
<button type="button" onClick="{{w.open}}" aria-label="放大查看 {{w.title}}" style="position: relative; display: block; width: 100%; padding: 0; border: 0; background: #16161A; border-radius: 6px; cursor: zoom-in; overflow: hidden">
<img src="{{w.src}}" alt="{{w.title}}" style="width: 100%; height: auto; display: block">
<sc-if value="{{w.multi}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(11,11,13,0.82); color: #F2F0EB; font-size: 13px; font-weight: 700">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="14" height="14" rx="2"></rect><path d="M3 17V5a2 2 0 0 1 2-2h12"></path></svg>{{w.countLabel}}</span>
</sc-if>
</button>
<div style="display: flex; justify-content: space-between; gap: 12px; align-items: baseline">
<h3 style="margin: 0; font-size: 18px; font-weight: 700">{{w.title}}</h3>
<span style="font-size: 13px; color: {{accent}}; white-space: nowrap">{{w.cat}}</span>
</div>
<p style="margin: -6px 0 0; font-size: 14px; color: #8E8B94">{{w.meta}}</p>
</article>
</sc-for>
</div>
</section>

<section id="about" style="max-width: 1360px; margin: 0 auto; padding: 96px 40px; border-top: 1px solid #222228; display: flex; flex-wrap: wrap; gap: 64px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.24em; color: {{accent}}">ABOUT</p>
<h2 style="margin: 0; font-size: 44px; font-weight: 900">關於我</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.8; color: #A9A6A0">[一段自我介紹：你的背景、擅長的風格、做美宣的理念，大約 2–3 句。]<br><br>經歷：系學會美宣長 · 2040school 美編組 · 五系聯合之夜美宣 · 創創入門 WanderQuest</p>
</div>
<div style="flex: 1.2 1 440px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="padding: 28px; background: #131316; border: 1px solid #222228; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 18px">活動主視覺</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #8E8B94">晚會 KV、頭貼、售票橫幅</p>
</div>
<div style="padding: 28px; background: #131316; border: 1px solid #222228; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 18px">社群貼文</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #8E8B94">系學會公告、宿營、特約、贊助貼文</p>
</div>
<div style="padding: 28px; background: #131316; border: 1px solid #222228; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 18px">新聞圖卡</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #8E8B94">2040school 新聞貼文版型與美編</p>
</div>
<div style="padding: 28px; background: #131316; border: 1px solid #222228; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 18px">插畫</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #8E8B94">Procreate 數位繪畫練習</p>
</div>
<p style="grid-column: 1 / -1; margin: 8px 0 0; font-size: 14px; color: #8E8B94">工具：Procreate · Canva · PowerPoint · 網站架設與網頁設計</p>
</div>
</section>

<section id="contact" style="max-width: 1360px; margin: 0 auto; padding: 96px 40px 64px; border-top: 1px solid #222228; display: flex; flex-direction: column; gap: 28px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.24em; color: {{accent}}">CONTACT</p>
<h2 style="margin: 0; font-size: 56px; line-height: 1.15; font-weight: 900">有案子想聊聊？</h2>
<a href="mailto:leichen.huang@gmail.com" style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: {{accent}}; text-decoration: none; width: fit-content">leichen.huang@gmail.com</a>
<div style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 15px">
<a href="https://www.instagram.com/awai.archive/">Instagram @awai.archive</a>
<a href="https://www.linkedin.com/in/leichen-huang-818753361/">LinkedIn</a>
</div>
<p style="margin: 48px 0 0; font-size: 13px; color: #77757F">© 2026 leichen. All works are copyright of their respective owners.</p>
</section>

<sc-if value="{{viewer.show}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="{{viewer.title}}" style="position: fixed; inset: 0; z-index: 50; background: rgba(8,8,10,0.95); display: flex; flex-direction: column; gap: 16px; padding: 20px 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; max-width: 1200px; width: 100%; margin: 0 auto">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">{{viewer.title}}</h2>
<p style="margin: 0; font-size: 14px; color: #8E8B94">{{viewer.meta}} · {{viewer.counter}}</p>
</div>
<button type="button" onClick="{{viewer.close}}" aria-label="關閉" style="flex: none; width: 48px; height: 48px; border-radius: 999px; border: 1px solid #3A3A42; background: transparent; color: #F2F0EB; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 16px">
<sc-if value="{{viewer.multi}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{viewer.prev}}" aria-label="上一張" style="flex: none; width: 52px; height: 52px; border-radius: 999px; border: 1px solid #3A3A42; background: #131316; color: #F2F0EB; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
</sc-if>
<img src="{{viewer.src}}" alt="{{viewer.title}}" style="max-width: min(100%, 1100px); max-height: 100%; object-fit: contain; display: block; border-radius: 4px; min-width: 0">
<sc-if value="{{viewer.multi}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{viewer.next}}" aria-label="下一張" style="flex: none; width: 52px; height: 52px; border-radius: 999px; border: 1px solid #3A3A42; background: #131316; color: #F2F0EB; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"></path></svg>
</button>
</sc-if>
</div>
<sc-if value="{{viewer.multi}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap">
<sc-for list="{{viewer.thumbs}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-label="{{t.label}}" style="{{t.style}}"><img src="{{t.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#3DA9FC","#C8F04A","#F2C94C"]},"$preview":{"width":1440,"height":3800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'all', open: null, idx: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#FF5A36';
    const cats = [
      { id: 'all', label: '全部' },
      { id: 'kv', label: '活動主視覺' },
      { id: 'social', label: '社群貼文' },
      { id: 'news', label: '新聞圖卡' },
      { id: 'illus', label: '插畫' }
    ];
    const names = { kv: '活動主視覺', social: '社群貼文', news: '新聞圖卡', illus: '插畫' };
    const B = '';
    const all = [
      ['social', '宿營回顧 系列貼文', '財政系系學會 · 2026', ['images/camp-review-1.jpg', 'images/camp-review-2.jpg', 'images/camp-review-3.jpg', 'images/camp-review-4.jpg']],
      ['kv', '指南大5廳 主視覺', '五系聯合之夜 · 2026', ['images/kv-5night.jpg', 'images/5night-2.jpg']],
      ['kv', '2026 聯合耶晚 Soirée 售票橫幅', '聯合耶晚 · IG 觸及 7,500+ · 2026', ['images/soiree.jpg']],
      ['social', '宿營報名貼文', '財政系系學會 · 2026', ['images/camp.jpg']],
      ['news', '《極端高溫或成為常態？》', '2040school 新聞圖卡 · 2026', ['images/news-heat.jpg']],
      ['news', '《哈利王子與王室間到底發生什麼事？》（上）', '2040school 新聞圖卡 · 2025', ['images/news-harry-1.jpg', 'images/news-harry-2.jpg', 'images/news-harry-3.jpg', 'images/news-harry-4.jpg', 'images/news-harry-5.jpg', 'images/news-harry-6.jpg', 'images/news-harry-7.jpg', 'images/news-harry-8.jpg']],
      ['social', '特約店家優惠', '財政系系學會 · 2026', ['images/partners.jpg']],
      ['illus', 'Procreate 臨摹練習', '個人練習 · 2026', ['images/procreate.jpg']],
      ['social', '包種茶節 攤位地圖', '財政系系學會 · 2026', ['images/tea-festival.jpg']],
      ['social', 'WHO ARE WE? 團隊介紹貼文', '創創入門 WanderQuest · IG @wanderquest_taiwan · 2026', ['images/wanderquest.jpg']]
    ].map(([c, t, m, ids], i) => ({
      key: i, c, title: t, cat: names[c], meta: m, ids, src: B + ids[0],
      multi: ids.length > 1, countLabel: ids.length + ' 張',
      open: () => this.setState({ open: i, idx: 0 })
    }));
    const cur = this.state.open == null ? null : all[this.state.open];
    const idx = this.state.idx;
    const go = (d) => () => this.setState({ idx: (idx + d + cur.ids.length) % cur.ids.length });
    const viewer = cur ? {
      show: true, title: cur.title, meta: cur.meta, multi: cur.multi,
      src: B + cur.ids[idx], counter: (idx + 1) + ' / ' + cur.ids.length,
      close: () => this.setState({ open: null }), prev: go(-1), next: go(1),
      thumbs: cur.ids.map((id, j) => ({
        src: B + id, label: '第 ' + (j + 1) + ' 張',
        pick: () => this.setState({ idx: j }),
        style: 'width: 56px; height: 70px; padding: 0; border-radius: 4px; overflow: hidden; cursor: pointer; background: #16161A; border: 2px solid ' + (j === idx ? accent : 'transparent') + '; opacity: ' + (j === idx ? '1' : '0.55')
      }))
    } : { show: false, multi: false, thumbs: [] };
    const sel = this.state.cat;
    const base = 'min-height: 44px; padding: 0 20px; border-radius: 999px; font-family: inherit; font-size: 15px; cursor: pointer; ';
    return {
      accent,
      viewer,
      tabs: cats.map((t) => ({
        label: t.label,
        pressed: t.id === sel ? 'true' : 'false',
        style: base + (t.id === sel ? 'background: ' + accent + '; color: #0B0B0D; border: 1px solid ' + accent + '; font-weight: 700' : 'background: transparent; color: #F2F0EB; border: 1px solid #3A3A42'),
        pick: () => this.setState({ cat: t.id })
      })),
      works: sel === 'all' ? all : all.filter((w) => w.c === sel)
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
